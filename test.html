<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Autofill Vault - Test Page</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #333; }
    input { width: 100%; padding: 8px; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Autofill Vault — Test Page</h2>
  <p>Open this file directly in Chrome (drag it into a tab, or File → Open File),
     click the 🔐 button in the bottom-right, and try dragging a chip onto a
     field below, or clicking a field then clicking a chip.</p>

  <label>Full Name <input type="text" name="fullname" /></label>
  <label>Email <input type="email" name="email" /></label>
  <label>Phone <input type="tel" name="phone" /></label>
  <label>Address <input type="text" name="address" /></label>
  <label>Card Number <input type="text" name="card" /></label>
</body>
</html>
